services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tasks_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "TasksApi_2024!"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./database/init.sql:/init.sql
      - ./database/entrypoint.sh:/entrypoint.sh
    entrypoint: /bin/bash /entrypoint.sh
    healthcheck:
      test: >
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "TasksApi_2024!"
        -Q "SELECT 1 FROM TasksDB.dbo.Tareas" -No -C
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s

  api:
    build: .
    container_name: tasks_api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      DB_NAME: TasksDB
      DB_HOST: sqlserver
      DB_INSTANCE: ""
      DB_USER: sa
      DB_PASSWORD: "TasksApi_2024!"
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  sqlserver_data:
